[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/digiogithub/Xarast"
authors = ["The Xarast contributors"]

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Fast iteration on a large workspace: optimise dependencies even in dev so that
# rasterising a real document in a debug build stays interactive.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Used by the golden-image and corpus tests, which are unbearably slow otherwise.
[profile.test]
opt-level = 2
