[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/digiogithub/Xarast"
authors = ["The Xarast contributors"]

# ── Shared dependency versions ───────────────────────────────────────────────
# Every crate references these with `workspace = true`, so a version bump
# happens in exactly one place and `cargo deny` sees a single graph.
[workspace.dependencies]
# Geometry. `kurbo` is the f64 curve library the whole stack (peniko, vello,
# parley) is built around; `i_overlay` supplies polygon booleans with a
# fixed-grid, bit-reproducible mode. Both are `MIT OR Apache-2.0`.
kurbo = "0.13"
i_overlay = "9.0"
bitflags = "2.9"
thiserror = "2.0"
slotmap = "1.0"
smallvec = "1.16"
# Persistent HAMT, used ONLY for history checkpoints (a snapshot *over* the
# arena) and for the arena-vs-persistent benchmark of
# `docs/10-architecture.md` §3.1. MPL-2.0, used unmodified: see deny.toml.
imbl = "7.0"

# `.xar` physical layer. flate2 gives raw DEFLATE (`windowBits = -15`) and the
# zlib CRC-32 the format's compressed blocks are checksummed with. Default
# backend is pure-Rust miniz_oxide, so there is no C dependency and no `unsafe`
# of ours. `MIT OR Apache-2.0`.
flate2 = "1.1"

# SHA-256: corpus lock verification in tests, `Document::canonical_digest()`
# and content-hash deduplication of bitmap resources. RustCrypto,
# `MIT OR Apache-2.0`.
sha2 = "0.10"

# ── Render engine ────────────────────────────────────────────────────────────
# `vello_cpu` is the coverage rasteriser the Phase 4 W0 spike selected; see
# `docs/memory/render.md` for the measurements. We use it as a rasteriser
# only: the scene, the display list, the paints, the compositor and the blend
# families are ours. `Apache-2.0 OR MIT`.
#
# Features: `std` and `u8_pipeline` are the production path, `f32_pipeline`
# is the higher-precision path used for `RenderQuality::Final` and for the
# golden oracle, `multithreading` gives the band parallelism. `text` and
# `png` are off: glyph rasterisation is Phase 9's and image I/O is Phase 10's.
vello_cpu = { version = "0.2", default-features = false, features = [
    "std",
    "u8_pipeline",
    "f32_pipeline",
    "multithreading",
] }
# The GPU backend, behind the `gpu` feature of `xarast-render`. Never built
# in CI's default job, because CI has no adapter. Both `Apache-2.0 OR MIT`.
vello = { version = "0.10", default-features = false, features = ["wgpu", "wgpu_default"] }
# Default features on purpose: with none, no backend is compiled in and
# `Instance::new` panics outright rather than reporting no adapter.
wgpu = "30"
# Golden-image encoding and decoding. `MIT OR Apache-2.0`.
png = "0.18"
# Band and tile parallelism. `MIT OR Apache-2.0`.
rayon = "1.12"

# Test and benchmark tooling.
proptest = "1.7"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tiny-skia = "0.12"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Fast iteration on a large workspace: optimise dependencies even in dev so that
# rasterising a real document in a debug build stays interactive.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding, not aborting. cargo-fuzz needs it to catch a panic as a finding
# rather than losing the process, and the .xar importer is fuzzed from day one.
panic = "unwind"

# Used by the golden-image and corpus tests, which are unbearably slow otherwise.
[profile.test]
opt-level = 2
