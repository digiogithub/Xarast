[package]
name = "xarast-io"
description = "Import and export filters for Xarast (SVG, PNG, JPEG, WebP, PDF)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# The "optimise (slower)" PNG pass. Off by default: it builds libdeflate
# from C and can take many times the encode itself (`docs/memory/export.md`).
oxipng = ["dep:oxipng"]

[dependencies]
xarast-doc = { path = "../xarast-doc" }
xarast-image = { path = "../xarast-image" }
xarast-render = { path = "../xarast-render" }
xarast-geom = { path = "../xarast-geom" }
xarast-color = { path = "../xarast-color" }
xarast-format = { path = "../xarast-format" }
xarast-text = { path = "../xarast-text" }
thiserror = { workspace = true }
serde = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
jpeg-encoder = { workspace = true }
image-webp = { workspace = true }
pdf-writer = { workspace = true }
kurbo = { workspace = true }
oxipng = { workspace = true, optional = true }

[dev-dependencies]
quick-xml = { workspace = true }
png = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
sha2 = { workspace = true }

[[bench]]
name = "export"
harness = false
