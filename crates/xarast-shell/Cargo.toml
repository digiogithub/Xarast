[package]
name = "xarast-shell"
description = "Windowing, GPU surface and platform integration for Xarast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["portals", "clipboard", "accessibility"]
# The AccessKit adapter: the interface's accessibility tree on AT-SPI.
accessibility = ["dep:accesskit_winit"]
# XDG portal file dialogs and the settings portal, on the services thread.
portals = ["dep:ashpd", "dep:futures-lite"]
# System clipboard. Off in builds that must not touch a display at all.
clipboard = ["dep:arboard"]

[dependencies]
xarast-app = { path = "../xarast-app" }
xarast-render = { path = "../xarast-render" }
# The composition root: the binary drives the interface and paints its
# output, so the shell sits above `xarast-ui` (architecture §1; phase-05
# criterion 16 allows `egui` here and only here besides `xarast-ui`).
xarast-ui = { path = "../xarast-ui" }
xarast-doc = { path = "../xarast-doc" }
xarast-geom = { path = "../xarast-geom" }
egui = { workspace = true }

winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

ashpd = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

# Wayland drag and drop (`wayland_dnd`), on the free desktops only.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
raw-window-handle = { workspace = true }

[[bin]]
name = "xarast"
path = "src/main.rs"
