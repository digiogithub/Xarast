# License policy for Xarast. Enforced in CI with `cargo deny check licenses`.
#
# Xarast ships as MIT OR Apache-2.0, which only holds if no copyleft dependency
# leaks into the binary. See docs/11-licensing-and-clean-room.md.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",   # per-file copyleft: acceptable only unmodified, see exceptions
]
confidence-threshold = 0.9

# Every MPL-2.0 or otherwise non-trivial crate must be listed here with a
# reason, so that adding one is a deliberate, reviewable act.
#
# resvg, usvg and their siblings are MPL-2.0: per-file copyleft. They are used
# unmodified, and only by `xtask`, which generates committed assets and never
# ships. Nothing in the distributed binary links them.
exceptions = [
    { name = "resvg", allow = ["MPL-2.0"] },
    { name = "usvg", allow = ["MPL-2.0"] },
    { name = "svgtypes", allow = ["MPL-2.0"] },
    { name = "simplecss", allow = ["MPL-2.0"] },
    { name = "svgfilters", allow = ["MPL-2.0"] },
]

[bans]
# Nothing in the GPL family may ever reach the dependency graph.
deny = []
multiple-versions = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
